# macOS build bundle (pi-flash-650): build the .app with the vendored pi,
# sign + notarize when Apple secrets are configured, ad-hoc sign otherwise.
# Windows stays a local-development build (see AGENTS.md) and is not built here.

name: release-macos

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  macos:
    runs-on: macos-14 # Apple silicon runner
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # vendored pi: node_modules is not committed (AGENTS.md 铁律)
      - name: Install vendored pi dependencies
        run: npm ci
        working-directory: vendor/pi

      # vendor/pi 的 @esbuild 带 26 个平台二进制（≈284MB），包内只留宿主
      # darwin-arm64（080-软件分发 §4；release.sh 对 Windows 包同理留 win32-x64）
      - name: Prune non-host esbuild binaries
        run: |
          ESD="vendor/pi/node_modules/@earendil-works/pi-coding-agent/node_modules/@esbuild"
          [ -d "$ESD/darwin-arm64" ] || { echo "missing @esbuild/darwin-arm64"; exit 1; }
          for d in "$ESD"/*; do
            [ "$(basename "$d")" = "darwin-arm64" ] || rm -rf "$d"
          done
          echo "pruned: $(ls "$ESD")"

      - name: Run pi-link tests (protocol conformance)
        run: cargo test -p pi-link

      - name: Build app (release)
        run: cargo build --release -p app

      - name: Fetch bundled node runtime (arm64)
        run: |
          NODE_VERSION=v22.14.0
          curl -fsSLO "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-arm64.tar.gz"
          tar -xzf "node-${NODE_VERSION}-darwin-arm64.tar.gz"
          cp "node-${NODE_VERSION}-darwin-arm64/bin/node" ./node
          chmod +x ./node
          rm -rf "node-${NODE_VERSION}-darwin-arm64.tar.gz" "node-${NODE_VERSION}-darwin-arm64"

      - name: Bundle pi-flash.app
        run: |
          set -euo pipefail
          APP=pi-flash.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/pi-flash "$APP/Contents/MacOS/pi-flash"
          cp node "$APP/Contents/MacOS/node"
          # brand icon (Big Sur grid master -> .icns)
          cp crates/app/assets/macos/pi-flash.icns "$APP/Contents/Resources/pi-flash.icns"
          # release layout: vendor/pi lives next to the executable
          cp -R vendor "$APP/Contents/MacOS/vendor"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>pi-flash</string>
            <key>CFBundleDisplayName</key><string>pi-flash</string>
            <key>CFBundleIdentifier</key><string>dev.pi-flash.app</string>
            <key>CFBundleExecutable</key><string>pi-flash</string>
            <key>CFBundleIconFile</key><string>pi-flash</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleVersion</key><string>${GITHUB_SHA::8}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # ad-hoc signature so the bundle launches even without Apple secrets
          # 禁用 codesign --deep：它会把 node_modules 里带点号的目录（.bin、ts3.4…）
          # 误判成 bundle 报 "bundle format unrecognized"（Apple TN2206 亦不推荐 --deep）。
          # 改为由内而外：先签 bundle 内所有 Mach-O，再签最外层。
          while IFS= read -r -d '' f; do
            case "$(file -b "$f")" in
              Mach-O*) codesign --force --sign - "$f" || exit 1 ;;
            esac
          done < <(find "$APP" -type f \( -perm -u+x -o -name '*.node' -o -name '*.dylib' \) -print0)
          codesign --force --sign - "$APP"
          zip -qry pi-flash-macos-arm64.zip "$APP"

      # real signing/notarization only when the repo has the secrets
      - name: Import signing identity
        if: ${{ env.APPLE_CERTIFICATE_P12 != '' }}
        run: |
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci-build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-build build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-build build.keychain
          rm /tmp/cert.p12

      - name: Codesign (Developer ID)
        if: ${{ env.APPLE_CERTIFICATE_P12 != '' }}
        run: |
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | awk '/Developer ID Application/ {print $2; exit}')
          test -n "$IDENTITY" || { echo "no Developer ID identity in keychain"; exit 1; }
          # 同上，避免 --deep 误判 node_modules 目录；由内而外逐个签 Mach-O
          while IFS= read -r -d '' f; do
            case "$(file -b "$f")" in
              Mach-O*) codesign --force --options runtime --timestamp --sign "$IDENTITY" "$f" || exit 1 ;;
            esac
          done < <(find pi-flash.app -type f \( -perm -u+x -o -name '*.node' -o -name '*.dylib' \) -print0)
          codesign --force --options runtime --timestamp --sign "$IDENTITY" pi-flash.app

      - name: Notarize + staple
        if: ${{ env.APPLE_CERTIFICATE_P12 != '' && env.APPLE_ID != '' }}
        run: |
          zip -qry pi-flash-macos-arm64.zip pi-flash.app
          xcrun notarytool submit pi-flash-macos-arm64.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple pi-flash.app
          rm pi-flash-macos-arm64.zip
          zip -qry pi-flash-macos-arm64.zip pi-flash.app

      # 资产名带版本与平台（npm 薄壳按 pi-flash-<ver>-darwin-arm64.zip 解析，
      # 080 §4）+ sidecar 校验和（薄壳下载时比对；SHA256SUMS 归 release.sh 不碰）
      - name: Name release assets + checksum
        id: assets
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="pi-flash-${GITHUB_REF_NAME#v}-darwin-arm64.zip"
            mv pi-flash-macos-arm64.zip "$NAME"
          else
            NAME="pi-flash-macos-arm64.zip"
          fi
          shasum -a 256 "$NAME" > "$NAME.sha256"
          cat "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pi-flash-macos-arm64
          path: ${{ steps.assets.outputs.name }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.assets.outputs.name }}
            ${{ steps.assets.outputs.name }}.sha256
