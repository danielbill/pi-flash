[package]
name = "app"
version = "0.1.1"
edition.workspace = true
# workspace 根是虚拟清单且成员里还有 pi-link 的 token-count 调试 bin，
# 不指名的话根目录 `cargo run` 报“could not determine which binary to run”
default-run = "pi-flash"

[[bin]]
name = "pi-flash"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
gpui = "0.2.2"
pi-link = { path = "../pi-link" }
futures = "0.3"
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
alacritty_terminal = "0.26"
# 编辑器底座（023）：Input 的 CodeEditor 模式；tree-sitter-languages 展开
# 全部内置语法（rust/py/c/cpp/toml/yaml…，默认只有 json）
gpui-component = { version = "0.2.0", features = ["tree-sitter-languages"] }
wry = "0.46"
scraper = "0.27.0"
ego-tree = "0.11"
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-render = { version = "0.1.14", features = ["embed-fonts"] }
lru = "0.18.5"
ratex-types = "0.1.14"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
# 文件树：gitignore 匹配（Zed worktree 同款）+ fs 监听（Zed fs 层同款）
ignore = "0.4"
notify = "7"

[dev-dependencies]
# gpui 测试夹具（TestAppContext + 真布局）——只有 app 的 test target 会带上
# test-support 特性，正常构建不受影响。
gpui = { version = "0.2.2", features = ["test-support"] }
