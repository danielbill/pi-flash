[package]
name = "app"
version = "0.3.0"
edition.workspace = true
license.workspace = true
# workspace 根是虚拟清单且成员里还有 pi-link 的 token-count 调试 bin，
# 不指名的话根目录 `cargo run` 报“could not determine which binary to run”
default-run = "pi-flash"

[[bin]]
name = "pi-flash"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
serde_json = "1"
winresource = "0.1"

[dependencies]
wasmtime = { version = "36", default-features = false, features = ["runtime", "cranelift", "component-model"] }
wasmtime-wasi = { version = "36", default-features = false }
gpui = "0.2.2"
pi-link = { path = "../pi-link" }
# QuickJS 插件运行时（pf_plugin 模块；wasm 侧依赖本 crate 的 wasmtime 已并列）
pf-plugin-host = { path = "../pf-plugin-host" }
futures = "0.3"
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
# ui.screenshot 的 PNG 编码（gpui 内部同版 0.25，共用一份编译）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
alacritty_terminal = "0.26"
# 编辑器底座（023）：Input 的 CodeEditor 模式；tree-sitter-languages 展开
# 全部内置语法（rust/py/c/cpp/toml/yaml…，默认只有 json）
gpui-component = { version = "0.2.0", features = ["tree-sitter-languages"] }
wry = "0.46"
scraper = "0.27.0"
ego-tree = "0.11"
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-render = { version = "0.1.14", features = ["embed-fonts"] }
lru = "0.18.5"
ratex-types = "0.1.14"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
# canonicalize 去除 Windows \\?\ verbatim 前缀（std 版必带，会漏进技能路径显示；Zed 同款）
dunce = "1"
# 项目搜索（083）：内容正则（Zed search.rs 用 fancy_regex，本项目只需
# 行级 find_iter，纯 regex 足够）+ include/exclude glob 过滤（Zed PathMatcher
# 的 globset 同实现）
regex = "1"
globset = "0.4"
# Zed search.rs 原码依赖（字面量多模式匹配 + 支持 lookaround 的正则）：
# 照抄 Zed 的查询层就必须用同一套 —— fancy_regex 版本与 syntect 锁定的
# 0.16 对齐，避免重复编译两份
fancy-regex = "0.19"
aho-corasick = "1"
# 文件树：gitignore 匹配（Zed worktree 同款）+ fs 监听（Zed fs 层同款）
ignore = "0.4"
notify = "7"
# 文件树右键菜单「删除至回收站」（021 设计；Windows 回收站 / macOS 废纸篓）
# 回收站删除：必须 coinit_multithreaded——gpui 后台线程池线程的 COM 已是
# MTA，trash 默认的 apartmentthreaded(STA) 会 RPC_E_CHANGED_MODE(0x80010106)
# 直接 panic；且两 feature 同开时 apartmentthreaded 后执行覆盖，必须关默认。
trash = { version = "5", default-features = false, features = [
    "coinit_multithreaded",
] }
# 微信远程控制（060）：渠道层 + 界面层 + transport；app 只做接线。
# lib crate 的 pub 项不触发 dead_code，见 §7 决策 7（2026-10-07 修订）。
wxprobe = { path = "../wxprobe" }
# 081 自动更新：GitHub release 检查/下载（与 pi-link 同版同特性，共用一份编译）
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "gzip"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 082 扩展更新检测：npm view 版本 semver 对比（pi-web plugin-updates 同款）
semver = "1"
# 文件打开编码检测（editor/file_content.rs，Zed file_content.rs 同款）：
# encoding_rs 解码/编码，chardetng 非Unicode 嗅探（GBK 等遗留编码可开可存）
encoding_rs = "0.8"
chardetng = "0.1"
anyhow = "1"

# 021 右键【执行】：PATH 扫描按驱动器类型过滤（GetDriveTypeW）——UNC/网络/
# 可移动盘整目录跳过，焊死死网络路径 SMB 超时这一唯一慢源
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_LibraryLoader"] }
# 任务栏固定稳定性（win_pin）：IShellLink 写稳定入口 lnk + 任务栏死链自愈
# （IShellLink/IPropertyStore COM）。版本对齐依赖树里已有的 0.61，不新增编译副本
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
# gpui 测试夹具（TestAppContext + 真布局）——只有 app 的 test target 会带上
# test-support 特性，正常构建不受影响。
gpui = { version = "0.2.2", features = ["test-support"] }
# perf_probe 基准（tests/perf_probe.rs）拆 ropey 各段成本；与
# gpui-component 的 ropey 锁同一 beta 版，避免重复编译两个版本。
ropey = "=2.0.0-beta.1"
# perf_probe 的 reset 路径拆解测试用到（与 gpui 生态同款 smallvec 1.x）
smallvec = "1"
