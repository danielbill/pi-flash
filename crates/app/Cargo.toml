[package]
name = "app"
version = "0.1.1"
edition.workspace = true

[[bin]]
name = "pi-flash"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
pi-link = { path = "../pi-link" }
futures = "0.3"
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
alacritty_terminal = "0.26"
gpui-component = "0.2.0"
wry = "0.46"
scraper = "0.27.0"
ego-tree = "0.11"
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-render = { version = "0.1.14", features = ["embed-fonts"] }
lru = "0.18.5"
ratex-types = "0.1.14"
