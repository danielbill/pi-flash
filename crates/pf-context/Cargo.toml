[package]
name = "pf-context"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order 由 pi-link 开启（feature 并集全仓生效）：Map 保插入序，
# 读-改-写才能做到未知键逐字保留。
serde_json = "1"
# 外部改动监听（001-0 §5）：非递归盯 PF 数据目录（app 用同版 7）
notify = "7"
# 仅 paths（app-settings.json 路径）+ config::write_json（tmp+rename 原子写）+
# dev_flags::KNOWN/enabled（boot-only 段，S2）；禁止依赖 RPC 层模块
pi-link = { path = "../pi-link" }
# 投影 generated_at（001-2 §2）；workspace 已有同版，零新增编译
chrono = "0.4"
# S5 domain 持久层（001-0 §2）：bundled 自带 SQLite（免系统依赖），WAL +
# busy_timeout；仅 domain 子集使用，settings 永不进 DB（001-0 §4 规则 3）
rusqlite = { version = "0.37", features = ["bundled"] }
