[package]
name = "wxprobe"
version = "0.1.0"
edition.workspace = true
publish = false

# P0/P1/P2 已完成；P3 起 `crates/app` 直接依赖本 crate 复用渠道层与界面层。
# 采用 **lib + bin** 双形态（060 §7 决策 7 已于 2026-10-07 修订）：lib 侧
# pub 项不触发 dead_code，app 的 `check_arch.sh` §4 `warnings: 0` 自然满足；
# bin 侧保留真机工具与 `wxprobe parity` 对拍 harness（P2 验收 42/42）。

[dependencies]
serde_json = "1"
base64 = "0.22"
pi-link = { path = "../pi-link" }
ureq = { version = "3.4.2", features = ["json"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
sha2 = "0.10"
hex = "0.4"
