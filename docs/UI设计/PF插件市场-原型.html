<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PF 插件市场 — 原型</title>
<!--
  PF-Market v1 原型（090-4）——按 pi market page（040-2）当前实现重排。
  卡片信息组织（自上而下）：名称 → 描述（两行截断）→ 发布时间 + [安装]（同行）。
  双列卡片网格；无卸载/更新按钮，只保留安装。
  不渲染（数据没有也不暴露）：类型徽标 / npm·repo·report 链接 / 安装命令框。
  配色 = theme.rs MIST 语义 token；尺寸 = UI组件规范（BTN_MD 28 · 卡片 p12 · r8）。
-->
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f8f7;              /* t.bg */
    color: #202e2b;                   /* t.text */
    font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    font-size: 12px;
    line-height: 22px;
    display: flex; justify-content: center;
    min-height: 100vh;
    padding: 24px 0;
  }
  .page { width: 1080px; display: flex; flex-direction: column; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;   /* 双排卡片 */
    gap: 12px;
  }

  .card {
    height: 150px;
    display: flex;
    gap: 12px;
    padding: 12px;
    background: #e9f0ee;              /* t.bg_panel */
    border: 1px solid #afc4ba;        /* t.border */
    border-radius: 8px;
  }
  .card:hover { background: #e0eae7; } /* t.bg_hover（规范 §6） */

  /* 预览槽（pi market 卡左列的位；v1 用图标 tile） */
  .preview {
    width: 72px; height: 72px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: #ecf3f0;              /* t.tool_bg */
    border-radius: 8px;
    color: #1e6559;                   /* t.accent */
  }
  .preview svg { width: 28px; height: 28px; }

  .body {
    flex: 1; min-width: 0;
    align-self: stretch;              /* 拉满卡高：名称/描述顶部，时间+安装底部 */
    display: flex; flex-direction: column; gap: 2px;
  }
  .name { font-weight: 600; font-size: 13px; }
  .desc {
    color: #52685f;                   /* t.text_dim */
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;            /* 两行截断 */
    overflow: hidden;
  }

  /* 发布时间 + 安装 同行，贴底（卡高变化时唯一随动的是中段空白） */
  .meta {
    display: flex; align-items: center; gap: 8px;
    margin-top: auto;
  }
  .time { color: #a3b0aa; font-size: 11px; }  /* t.text_faint */
  .pub  { color: #52685f; font-size: 11px; }  /* t.text_dim：发布人（pi market 同位 publisher） */
  .meta .spacer { flex: 1; }

  /* 安装钮 = 宿主 pi_native_market card.rs:430-476 同款：
     边框盒（h33.3/min-w72/px9.36 · line 色 · mono 11 · 文字 dim）内 [ 括号+label+括号 ]，
     括号 accent 色；busy = 转圈；已装 = ✓ 绿（accent，不可点） */
  .install {
    height: 33.3px; min-width: 72px; padding: 0 9.36px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    border: 1px solid #afc4ba;        /* t.border = d::line() 的 mist 语义 */
    font: 400 11px "JetBrains Mono", Consolas, monospace;   /* d::MONO 同款，字重 400=源码未设 */
    color: #52685f;                   /* t.text_dim（源码 0xd5d8db@0.8 的语义位） */
    cursor: pointer; white-space: nowrap;
  }
  .install:hover { color: #1e6559; }  /* t.accent */
  .install .bkt { color: #1e6559; padding: 0 4.6px; }  /* 括号 accent（bracket()） */
  .install:disabled { cursor: default; color: #7fb28a; }  /* 已装 ✓ 绿（源码 0x5db87a → mist accent 系） */
  .spinner {
    width: 11px; height: 11px; border-radius: 50%;
    border: 1.5px solid #afc4ba; border-top-color: #1e6559;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty {
    grid-column: 1 / -1;
    padding: 32px; text-align: center;
    color: #455f56;
    background: #e9f0ee;
    border: 1px dashed #afc4ba; border-radius: 8px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="grid" id="grid"></div>
</div>

<script>
const ICONS = {
  bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"/></svg>',
  git:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-4.5 3.5-8 5"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>',
  wx:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3C5 3 2 5.6 2 8.9c0 1.8.9 3.4 2.3 4.5L3.6 16l2.8-1.4c.7.2 1.4.3 2.1.3"/><path d="M13 7c3 0 6 2.2 6 5.2 0 1.6-.8 3-2.1 4l.6 2.3-2.5-1.2c-.6.2-1.3.3-2 .3-3 0-6-2.2-6-5.2S10 7 13 7Z"/></svg>',
};

const plugins = [
  {
    name: "快捷面板",
    icon: "bolt",
    desc: "会话与常用提问的快捷入口面板，一键新建会话、打开文件夹、发送常用提问",
    time: "2026-10-22",
  },
  {
    name: "Git 面板",
    icon: "git",
    desc: "本地 git 状态一览与常用操作，分支/暂存/提交一目了然",
    time: "2026-10-18",
  },
  {
    name: "搜索增强",
    icon: "search",
    desc: "跨文件关键词搜索的快捷入口",
    time: "2026-10-15",
  },
  {
    name: "微信远程",
    icon: "wx",
    desc: "微信扫码远程控制会话，手机上随时给 PF 派活",
    time: "2026-10-11",
  },
];

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  for (const p of plugins) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="preview">${ICONS[p.icon]}</div>
      <div class="body">
        <div class="name">${p.name}</div>
        <div class="desc">${p.desc}</div>
        <div class="meta">
          <span class="pub">Pi-Flash</span>
          <span class="time">${p.time}</span>
          <span class="spacer"></span>
          <button class="install" data-act="install"><span class="bkt">[</span>安装<span class="bkt">]</span></button>
        </div>
      </div>`;
    grid.appendChild(card);
  }
}

document.getElementById("grid").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  btn.classList.add("busy");
  
  if (btn.dataset.busy) return;      // busy = 转圈（源码同款），无文字变化
  btn.dataset.busy = "1";
  btn.innerHTML = '<span class="spinner"></span>';
  setTimeout(() => {           // 演示：真实实现走 npm pack → 校验 → 落盘 → 台账
    delete btn.dataset.busy;
    btn.disabled = true;
    btn.innerHTML = '✓';
  }, 900);
});

render();
</script>
</body>
</html>
