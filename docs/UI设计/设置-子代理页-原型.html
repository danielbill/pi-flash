<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-flash · Settings-子代理 页原型</title>
<style>
  :root {
    --bg: #f4f8f7;
    --bg-panel: #e9f0ee;
    --bg-hover: #e0eae7;
    --bg-selected: #d7e4df;
    --border: #afc4ba;
    --text: #202e2b;
    --text-muted: #455f56;
    --text-dim: #52685f;
    --text-faint: #a3b0aa;
    --accent: #1e6559;
    --accent-hover: #174f46;
    --danger: #c25460;
    --chrome: #dfe9e5;
    --nav: #eef4f1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 12px; color: var(--text);
         background: var(--chrome); height: 100vh; overflow: hidden;
         display: flex; align-items: center; justify-content: center; }

  .settings-mask { position: fixed; inset: 0; background: rgba(32,46,43,.28); display: flex; align-items: center; justify-content: center; }
  .settings { width: min(1200px, 94vw); height: min(720px, 88vh); background: var(--bg);
              border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
              box-shadow: 0 18px 50px rgba(32,46,43,.25); }
  .settings-topbar { height: 40px; flex: none; background: var(--chrome); position: relative;
                     display: flex; align-items: center; }
  .settings-topbar .x { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border-radius: 6px; border: 0; background: transparent; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; cursor: default; padding: 0; }
  .settings-topbar .x:hover { background: #d8626a; color: #fff; }
  .settings-topbar .x svg { width: 12px; height: 12px; }

  .set-nav { width: 160px; flex: none; background: var(--nav); border-right: 1px solid var(--border);
             border-bottom-left-radius: 10px; display: flex; flex-direction: column; padding: 12px 8px 8px; }
  .set-nav button { border: 0; background: transparent; text-align: left; padding: 7.5px 10px;
    border-radius: 8px; margin-bottom: 1px; font-size: 13px; color: var(--text-muted); font-family: inherit;
    cursor: default; display: flex; align-items: center; gap: 9px; }
  .set-nav button svg { width: 15px; height: 15px; flex: none; }
  .set-nav button.on { background: var(--bg-selected); color: var(--text); font-weight: 600; }
  .set-nav button.on svg { color: var(--accent); }
  .set-nav button:hover { background: var(--bg-hover); color: var(--text); }

  .body { flex: 1; min-height: 0; display: flex; }

  .sb, .sb *, .detail, .detail *, .set-nav, .set-nav * { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .sb { width: 400px; flex: none; background: var(--bg); border-right: 1px solid var(--border);
        display: flex; flex-direction: column; }
  .sb-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 6px 0; }
  .sb-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 3px;
    font-size: 10px; font-weight: 600; color: var(--text-dim); }
  .sb-head .cnt { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 400; color: var(--text-dim); }
  .sb-li { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; margin-bottom: 1px;
    border-radius: 5px; background: var(--bg); font-size: 12px; color: var(--text-muted); cursor: default; }
  .sb-li:hover { background: var(--bg-hover); }
  .sb-li.sel { background: var(--bg-selected); font-weight: 600; color: var(--text); }
  .sb-li .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--accent); }
  .sb-li .name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .sb-li .act { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  .detail { flex: 1; min-width: 0; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }

  .btn { height: 28px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px;
    background: transparent; color: var(--text); font-size: 12px; font-family: inherit; cursor: default;
    display: inline-flex; align-items: center; gap: 8px; flex: none; white-space: nowrap; }
  .btn:hover { background: var(--bg-hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger { color: var(--danger); border-color: rgba(194,84,96,.35); }
  .btn.danger:hover { background: rgba(194,84,96,.12); }

  .sw { flex: none; width: 28px; height: 16px; border-radius: 8px; background: var(--bg-selected);
    border: 1px solid var(--border); position: relative; cursor: default; display: inline-block; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px;
    border-radius: 5px; background: var(--bg); }
  .sw.on { background: var(--accent); border-color: var(--accent); }
  .sw.on::after { left: 14px; background: var(--bg); }

  .row { display: flex; align-items: center; gap: 8px; flex: none; }
  .row > .nm { width: 96px; flex: none; font-size: 12px; align-self: flex-start; padding-top: 8px; }
  .row > .ct { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  input[type=text] { height: 30px; border: 1px solid var(--border); background: var(--bg-panel);
    border-radius: 6px; padding: 0 10px; font-size: 12px; color: var(--text); font-family: inherit; outline: 0; }
  input[type=text]:focus { border-color: var(--accent); }
  .nm-input { width: 250px; font-weight: 600; }
  textarea { width: 100%; height: 170px; resize: none; border: 1px solid var(--border);
    border-radius: 6px; background: var(--bg-panel); padding: 8px 10px; font-size: 12px;
    line-height: 1.65; color: var(--text); font-family: inherit; outline: 0; }
  textarea:focus { border-color: var(--accent); }
  .sel-btn { height: 30px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-panel);
    padding: 0 10px; font-size: 12px; color: var(--text); font-family: inherit; cursor: default;
    display: inline-flex; align-items: center; }
  .sel-btn .chev { width: 10px; height: 10px; color: var(--text-dim); flex: none; margin-left: auto; }

  .dd { position: relative; width: 250px; }
  .dd-menu { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(32,46,43,.16); }
  .dd.open .dd-menu { display: block; }
  .dd-it { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 12px; cursor: default; }
  .dd-it:hover { background: var(--bg-hover); }
  .dd-it::before { content: ""; width: 12px; flex: none; }
  .dd-it.on::before { content: "✓"; color: var(--accent); font-weight: 700; }
  .dd-it .n { font-family: "JetBrains Mono", monospace; }
  .dd-it .d { margin-left: auto; font-size: 11px; color: var(--text-faint); }
  .dd-sep { height: 1px; margin: 4px 0; background: var(--border); }

  .seg { display: flex; align-items: stretch; flex: none; border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; background: var(--bg-panel); }
  .seg button { border: 0; background: transparent; height: 28px; padding: 0 14px; font-size: 12px;
    color: var(--text-muted); cursor: default; font-family: inherit; }
  .seg button.on { background: var(--bg-selected); color: var(--text); font-weight: 600; }

  .detail-head { display: flex; align-items: center; gap: 8px; flex: none; }
  .detail-head .nm { width: 96px; flex: none; font-size: 12px; align-self: center; }
  .detail-head input.nm-input { flex: none; }
  .frm { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .frm.ro { pointer-events: none; opacity: .62; }
  .pane { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .pane.on { display: flex; }
</style>
</head>
<body>

<div class="settings-mask">
  <div class="settings">
    <div class="settings-topbar">
      <button class="x"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
    </div>
    <div class="body">
      <aside class="set-nav">
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>界面</button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3"/></svg>模型</button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>技能</button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22v-5"/><path d="M15 8V2"/><path d="M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1z"/><path d="M9 8V2"/></svg>扩展</button>
        <button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="9" cy="12" r="2.2"/><path d="M14 10h4M14 14h4M6.8 9.8h.01M6.8 14.2h.01"/></svg>子代理</button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/></svg>MCP</button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>其他</button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>关于</button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M8 16h8"/></svg>快捷键</button>
      </aside>

      <div class="sb">
        <div class="sb-scroll">
          <div class="sb-head">内置<span class="cnt">1</span></div>
          <div class="sb-li" data-d="d-explorer">
            <i class="dot"></i><div class="name">explorer</div>
          </div>
          <div class="sb-head" style="margin-top:8px">自定义<span class="cnt">1</span><span style="flex:1"></span><button class="btn">新建</button></div>
          <div class="sb-li sel" data-d="d-reviewer">
            <i class="dot"></i><div class="name">code-reviewer</div>
          </div>
        </div>
      </div>

      <div class="detail">
        <div class="pane on" id="d-reviewer">
          <div class="detail-head">
            <span class="nm">名称</span>
            <input type="text" class="nm-input" value="code-reviewer">
            <span style="flex:1"></span>
            <button class="btn danger">删除</button>
            <button class="btn primary">保存</button>
          </div>
          <div class="frm">
            <div class="row"><span class="nm">描述</span><span class="ct"><input type="text" style="width:100%" value="代码评审 · 正确性与边界"></span></div>
            <div class="row"><span class="nm">模型</span><span class="ct">
              <div class="dd" id="dd-model">
                <button class="sel-btn dd-btn" type="button" style="width:250px;justify-content:space-between"><span id="dd-model-val">继承</span><svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg></button>
                <div class="dd-menu">
                  <div class="dd-it on" data-v="继承"><span class="n">继承</span></div>
                  <div class="dd-sep"></div>
                  <div class="dd-it on" data-v="self-hosted/qwen3-next"><span class="n">self-hosted/qwen3-next</span></div>
                  <div class="dd-it" data-v="self-hosted/gpt-oss-120b"><span class="n">self-hosted/gpt-oss-120b</span></div>
                  <div class="dd-it" data-v="deepseek/deepseek-chat"><span class="n">deepseek/deepseek-chat</span></div>
                  <div class="dd-it" data-v="deepseek/deepseek-reasoner"><span class="n">deepseek/deepseek-reasoner</span></div>
                  <div class="dd-it" data-v="zai/glm-5.3-flash"><span class="n">zai/glm-5.3-flash</span></div>
                </div>
              </div>
            </span></div>
            <div class="row"><span class="nm">工具权限</span><span class="ct">
              <div class="dd" id="dd-tools">
                <button class="sel-btn dd-btn" type="button" style="width:250px;justify-content:space-between"><span id="dd-tools-val">继承委派者</span><svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg></button>
                <div class="dd-menu">
                  <div class="dd-it on" data-v="继承委派者"><span class="n">继承委派者</span></div>
                  <div class="dd-it" data-v="read-only"><span class="n">read-only</span><span class="d">4 个只读内置工具</span></div>
                  <div class="dd-it" data-v="default"><span class="n">default</span><span class="d">4 个内置工具</span></div>
                  <div class="dd-it" data-v="full"><span class="n">full</span><span class="d">全部内置工具，无扩展</span></div>
                </div>
              </div>
            </span></div>
            <div class="row"><span class="nm">系统提示</span><span class="ct">
              <textarea spellcheck="false">你是资深代码评审员，只做评审不写代码。
关注正确性、边界条件、并发安全与错误处理。

输出格式：按严重度分级的问题清单 + 每条附修复建议。</textarea>
            </span></div>
            <div class="row"><span class="nm">最大轮次</span><span class="ct">
              <div class="seg" id="seg-turns"><button>50</button><button class="on">100</button><button>不限</button><button>指定</button></div>
              <input type="text" id="turns-n" value="25" style="width:70px;display:none;text-align:center;font-family:'JetBrains Mono',monospace">
              <span style="flex:1"></span>
              <span>注入AGENTS.md</span>
              <i class="sw on"></i>
            </span></div>
          </div>
        </div>

        <div class="pane" id="d-explorer">
          <div class="detail-head">
            <span class="nm">名称</span>
            <input type="text" class="nm-input" value="explorer" readonly>
            <span style="flex:1"></span>
            <button class="btn">复制为自定义</button>
          </div>
          <div class="frm ro">
            <div class="row"><span class="nm">描述</span><span class="ct"><input type="text" style="width:100%" value="只读探索 · 调研与定位" readonly></span></div>
            <div class="row"><span class="nm">模型</span><span class="ct">
              <button class="sel-btn" style="width:250px;justify-content:space-between">继承<svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg></button>
            </span></div>
            <div class="row"><span class="nm">工具权限</span><span class="ct">
              <button class="sel-btn" style="width:250px;justify-content:space-between">read-only<svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg></button>
            </span></div>
            <div class="row"><span class="nm">系统提示</span><span class="ct">
              <textarea readonly>你是本地探索员：探索目录、调研代码、定位信息、搜寻答案。不执行写操作。</textarea>
            </span></div>
            <div class="row"><span class="nm">最大轮次</span><span class="ct">
              <div class="seg"><button>50</button><button>100</button><button class="on">不限</button><button>指定</button></div>
              <span style="flex:1"></span>
              <span>注入AGENTS.md</span>
              <i class="sw on"></i>
            </span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.querySelectorAll('.sb-li').forEach(li => {
    li.addEventListener('click', () => {
      document.querySelectorAll('.sb-li').forEach(x => x.classList.remove('sel'));
      li.classList.add('sel');
      document.querySelectorAll('.detail > .pane').forEach(p => p.classList.remove('on'));
      const d = document.getElementById(li.dataset.d);
      if (d) d.classList.add('on');
    });
  });
  const dd = document.getElementById('dd-tools');
  dd.querySelector('.dd-btn').addEventListener('click', e => {
    e.stopPropagation();
    dd.classList.toggle('open');
  });
  dd.querySelectorAll('.dd-it').forEach(it => it.addEventListener('click', () => {
    dd.querySelectorAll('.dd-it').forEach(x => x.classList.remove('on'));
    it.classList.add('on');
    document.getElementById('dd-tools-val').textContent = it.dataset.v;
    dd.classList.remove('open');
  }));
  document.addEventListener('click', () => document.querySelectorAll('.dd').forEach(d => d.classList.remove('open')));

  function bindDd(id, valId) {
    const d = document.getElementById(id);
    d.querySelector('.dd-btn').addEventListener('click', e => {
      e.stopPropagation();
      document.querySelectorAll('.dd').forEach(x => { if (x !== d) x.classList.remove('open'); });
      d.classList.toggle('open');
    });
    d.querySelectorAll('.dd-it').forEach(it => it.addEventListener('click', () => {
      d.querySelectorAll('.dd-it').forEach(x => x.classList.remove('on'));
      it.classList.add('on');
      document.getElementById(valId).textContent = it.dataset.v;
      d.classList.remove('open');
    }));
  }
  bindDd('dd-model', 'dd-model-val');

  const segT = document.getElementById('seg-turns');
  if (segT) segT.querySelectorAll('button').forEach((b, i, all) => b.addEventListener('click', () => {
    all.forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('turns-n').style.display = (b.textContent === '指定') ? '' : 'none';
  }));
  bindDd('dd-tools', 'dd-tools-val');
</script>
</body>
</html>
