[workspace]
resolver = "2"
members = ["crates/pi-link", "crates/app", "crates/pf-plugin-host"]
# [patch.crates-io] 的候选包不在 members 里；Cargo 重解析时会对工作区目录
# 内的非成员包做归属检查——显式排除（vendor/gpui 先前未报错只因锁文件
# 一直免于重解析）。
exclude = ["vendor/gpui", "vendor/gpui-component"]

[workspace.package]
edition = "2024"
# 继承 Zed 生态（crates/ui、theme、terminal 均 GPL-3.0-or-later，派生代码在库）；
# 第三方来源清单见 THIRD-PARTY-NOTICES.md
license = "GPL-3.0-or-later"

[profile.dev]
debug = 1
# 关增量编译：省 target/debug/incremental 常驻数 G（同一 crate 会按指纹囤好几份
# 副本，cargo 只偶尔清旧的）。代价：改动所在 crate 的重编译慢 20~40%，
# 链接/未改依赖不受影响。临时要快迭代：CARGO_INCREMENTAL=1 cargo run -p app
#（env 覆盖 profile）。
incremental = false

[profile.dev.package."*"]
debug = false               # 依赖不带调试信息：windows/gpui 的 rlib 和 pdb 直接瘦一圈

# vendored gpui 保留行号表方便断点进内部；2026-11-05 加 O2——真实目录内容下
# debug 每键 18-23ms/帧明显卡顿（release 同场景 3.9-4.2ms），渲染主路径
# （元素树/paint/文本 shaping/hit-test）不能在 O0 跑。单步会跳（内联），断点可进。
[profile.dev.package.gpui]
debug = 1
opt-level = 2

[profile.dev.package.gpui-component]
debug = 1
opt-level = 2

# 帧时间热依赖在 dev 下单独 O3——对齐 Zed 自己的 Cargo.toml
# [profile.dev.package]（taffy / tree-sitter / serde_json 三项就是 zed 的配置）。
# pi-flash 之前 dev 全量 O0：debug 帧时间（实测 57ms/帧，空会话视图）里
# taffy 的 flex 布局占了很大一块，热依赖优化后 debug 也接近可用手感。
[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.tree-sitter]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

# app/pi-link 自身代码 O1（2026-11-05）：debug 帧大头在 Chat::render 的元素
# 构造与清单解析循环（frame.settings 9ms / listing 6ms @O0）。O1 对计算密集
# 段 ~2-3 倍，断点可进；代价：本 crate 重编译变慢（dev 关增量，改动 app
# 代码的重编感知明显，忍不了就临时 CARGO_INCREMENTAL=1）。
[profile.dev.package.app]
opt-level = 1

[profile.dev.package.pi-link]
opt-level = 1

[profile.dev.package.pf-plugin-host]
opt-level = 1

[patch.crates-io]
gpui = { path = "vendor/gpui" }
gpui-component = { path = "vendor/gpui-component" }
