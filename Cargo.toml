[workspace]
resolver = "2"
members = ["crates/pi-link", "crates/app", "crates/wxprobe"]
# [patch.crates-io] 的候选包不在 members 里；Cargo 重解析时会对工作区目录
# 内的非成员包做归属检查——显式排除（vendor/gpui 先前未报错只因锁文件
# 一直免于重解析）。
exclude = ["vendor/gpui", "vendor/gpui-component"]

[workspace.package]
edition = "2024"
# 继承 Zed 生态（crates/ui、theme、terminal 均 GPL-3.0-or-later，派生代码在库）；
# 第三方来源清单见 THIRD-PARTY-NOTICES.md
license = "GPL-3.0-or-later"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false               # 依赖不带调试信息：windows/gpui 的 rlib 和 pdb 直接瘦一圈

[profile.dev.package.gpui]
debug = 1                   # vendored 的 gpui 保留行号表，方便断点进 gpui 内部

[profile.dev.package.gpui-component]
debug = 1

# 帧时间热依赖在 dev 下单独 O3——对齐 Zed 自己的 Cargo.toml
# [profile.dev.package]（taffy / tree-sitter / serde_json 三项就是 zed 的配置）。
# pi-flash 之前 dev 全量 O0：debug 帧时间（实测 57ms/帧，空会话视图）里
# taffy 的 flex 布局占了很大一块，热依赖优化后 debug 也接近可用手感。
[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.tree-sitter]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[patch.crates-io]
gpui = { path = "vendor/gpui" }
gpui-component = { path = "vendor/gpui-component" }
